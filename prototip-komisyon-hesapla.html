<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Komisyon Hesaplayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
/* ===== design.md (Shopier satıcı paneli) tokenları — Bölüm 11 ===== */
:root {
  --sp-bg-page: #F6F9FA; --sp-surface: #FFFFFF; --sp-focus-bg: #F2F4F5; --sp-disabled-bg: #F9F9FA;
  --sp-row-open-bg: #FFF7E2; --sp-error-bg: rgba(234, 44, 84, .1); --sp-backdrop: rgba(0, 0, 0, .3);
  --sp-text: #7A8994; --sp-text-heading: #373E43; --sp-text-strong: #212528; --sp-text-ink: #000000;
  --sp-text-crumb: #7B7D82; --sp-text-th: rgba(55, 62, 67, .35); --sp-text-tab: rgba(122, 137, 148, .7);
  --sp-text-menu: #627182; --sp-text-btn-default: #5E5E5E; --sp-text-disabled: rgba(122, 137, 148, .23); --sp-link: #0064BC;
  --sp-border: rgba(0, 0, 0, .07); --sp-border-focus: rgba(0, 0, 0, .1); --sp-border-row: rgba(234, 236, 238, .7);
  --sp-border-divider: #EAECEE; --sp-border-btn: #F2F4F5; --sp-border-btn-hover: rgba(122, 137, 148, .27);
  --sp-border-check: #D7DCDF; --sp-border-switch: #DFDFDF; --sp-border-modal: #F2F6F7; --sp-border-sidebar: #F2F2F2;
  --sp-master: #7A8994; --sp-master-dark: #373E43; --sp-master-darker: #212528; --sp-master-light: #EAECEE; --sp-master-lighter: #F2F4F5; --sp-master-lightest: #F6F9FA;
  --sp-primary: #007BE8; --sp-primary-dark: #0064BC; --sp-primary-light: #3395ED; --sp-primary-lighter: #CCE5FA;
  --sp-complete: #00E8BA; --sp-complete-dark: #00BC97; --sp-complete-darker: #008B70; --sp-complete-light: #33EDC8; --sp-complete-lighter: #CCFAF1;
  --sp-danger: #EA2C54; --sp-danger-dark: #BE2444; --sp-danger-darker: #8C1A32; --sp-danger-light: #EE5676; --sp-danger-lighter: #FBD5DD;
  --sp-warning: #FED76E; --sp-warning-darker: #988142; --sp-warning-lighter: #FFF7E2;
  --sp-info: #47525E; --sp-info-dark: #3A424C; --sp-info-light: #6C757E;
  --sp-font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
  --sp-font-label: "Montserrat", var(--sp-font-body);
  --sp-font-control: Arial, sans-serif;
  --sp-fs-body: 13px; --sp-lh-body: 20px; --sp-fs-micro: 10.5px; --sp-ls-micro: .06em;
  --sp-r-card: 1px; --sp-r-input: 2px; --sp-r-btn: 3px; --sp-r-modal: 3px; --sp-r-label: .25em;
  --sp-shadow-dropdown: 0 0 5px rgba(122, 137, 148, .2); --sp-shadow-select: 0 4px 5px rgba(0, 0, 0, .15);
  --sp-shadow-knob: 0 1px 3px rgba(0, 0, 0, .4);
  --sp-t-color: .1s linear; --sp-t-field: .2s ease; --sp-ease-panel: cubic-bezier(.05, .74, .27, .99);

  /* Senaryo paneli tokenları (ürünün parçası değil) */
  --pn-bg: #E9EBEE; --pn-surface: #FFFFFF; --pn-ink: #1F2328; --pn-muted: #5B6470; --pn-line: #B8BEC6;
  --pn-ok: #1A7F37; --pn-bad: #B42318; --pn-accent: #2F3A48;
  --pn-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--pn-bg); font-family: var(--pn-font); color: var(--pn-ink); }
button { font: inherit; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===== Prototip yerleşimi ===== */
.proto { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); align-items: start; }
@media (max-width: 960px) { .proto { grid-template-columns: minmax(0, 1fr); } }
.stage { min-width: 0; }
.frame-wrap { position: relative; margin: 0 auto; }
.frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: var(--sp-bg-page); border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 12px 32px rgba(0,0,0,.14); }
.f-m { width: 393px; height: 852px; }
.f-d { width: 1280px; height: 800px; }
.stage-cap { font: 12px/1.4 var(--pn-font); color: var(--pn-muted); text-align: center; margin: 0 0 8px; }

/* ===== Senaryo paneli ===== */
.sc { background: var(--pn-surface); border: 1.5px dashed var(--pn-line); border-radius: 10px; padding: 14px; font: 13px/1.45 var(--pn-font); position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
@media (max-width: 960px) { .sc { position: static; max-height: none; } }
.sc h1 { font-size: 15px; margin: 0 0 4px; }
.sc .note { font-size: 12px; color: var(--pn-muted); margin: 0 0 12px; padding: 8px 10px; background: #F4F5F7; border-radius: 6px; }
.sc h2 { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--pn-muted); margin: 16px 0 6px; }
.sc .row { margin: 6px 0; }
.sc span.lbl { display: block; font-size: 12px; color: var(--pn-muted); margin: 10px 0 3px; }
.sc label.lbl { display: block; font-size: 12px; color: var(--pn-muted); margin-bottom: 3px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--pn-line); background: #fff; color: var(--pn-ink); border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--pn-accent); border-color: var(--pn-accent); color: #fff; }
.sc select, .sc input[type=date], .sc input[type=datetime-local], .sc input[type=text] { width: 100%; font: 13px var(--pn-font); padding: 5px 7px; border: 1px solid var(--pn-line); border-radius: 6px; background: #fff; color: var(--pn-ink); }
.sc .chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin: 4px 0; }
.sc .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sc .chips button { border: 1px dashed var(--pn-line); background: #FAFAFB; border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.rules { list-style: none; padding: 0; margin: 0; }
.rules li { display: flex; gap: 6px; padding: 3px 0; font-size: 12.5px; border-bottom: 1px dotted #E1E4E8; }
.rules li .m { flex: 0 0 16px; font-weight: 700; }
.rules li.ok .m { color: var(--pn-ok); } .rules li.bad .m { color: var(--pn-bad); } .rules li.na .m { color: var(--pn-muted); }
.rules li .v { color: var(--pn-muted); font-size: 12px; }
.result { margin-top: 8px; padding: 8px 10px; background: #EEF2F6; border-left: 3px solid var(--pn-accent); border-radius: 4px; font-size: 12.5px; font-weight: 600; }
.sc .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
.sc ol.sim { padding-left: 20px; margin: 4px 0; } .sc ol.sim li { margin: 3px 0; font-size: 12.5px; }
.tagsrc { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--pn-line); color: var(--pn-muted); margin-left: 4px; }
.tagsrc.sel { border-color: var(--pn-accent); color: var(--pn-accent); }
.sc .log { font-size: 12px; color: var(--pn-muted); min-height: 18px; }
.sc button:focus-visible, .sc select:focus-visible, .sc input:focus-visible { outline: 2px solid var(--pn-accent); outline-offset: 1px; }

/* ===== Ürün alanı (yalnız design.md) ===== */
.app { position: absolute; inset: 0; font: 400 var(--sp-fs-body)/var(--sp-lh-body) var(--sp-font-body); color: var(--sp-text); letter-spacing: .01em; background: var(--sp-bg-page); -webkit-font-smoothing: antialiased; }
.app h1, .app h2, .app h3, .app h4, .app h5 { font-family: var(--sp-font-body); color: var(--sp-text-heading); font-weight: 300; margin: 0; }
.app h3 { font-size: 24px; line-height: 35.88px; } .app h4 { font-size: 18px; line-height: 33.88px; } .app h5 { font-size: 16px; line-height: 25.88px; }
.app p { margin: 0 0 10px; }
.app a { color: var(--sp-link); text-decoration: none; transition: color var(--sp-t-color); }
.app .ic { display: inline-block; vertical-align: -0.15em; flex: none; }
.app :focus-visible { outline: 2px solid var(--sp-primary); outline-offset: 2px; }
.app .small { font-size: 11.6px; line-height: 17px; }
.app .hint { opacity: .7; }
.app .micro { font: 500 var(--sp-fs-micro)/1.7 var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); }
.app .text-primary { color: var(--sp-primary); } .app .text-danger { color: var(--sp-danger); } .app .text-heading { color: var(--sp-text-heading); }
.app .bold { font-weight: 700; } .app .right { text-align: right; }
.app .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell */
.sb { position: absolute; left: 0; top: 0; bottom: 0; width: 250px; background: #fff; border-right: 1px solid var(--sp-border-sidebar); overflow: auto; z-index: 20; transition: transform .4s var(--sp-ease-panel); }
.sb .brand { height: 60px; padding: 0 20px 0 30px; display: flex; align-items: center; font: 600 20px/1 var(--sp-font-label); color: var(--sp-text-heading); letter-spacing: -.01em; }
.sb ul { list-style: none; margin: 0; padding: 0; }
.sb .menu { padding-top: 20px; }
.sb .mi > a { display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 14px 0 32px; font: 400 14px/40px var(--sp-font-control); color: var(--sp-text-menu); cursor: default; }
.sb .mi.active > a { color: #000; }
.sb .mi .tb { width: 40px; height: 40px; display: grid; place-items: center; color: var(--sp-text-menu); }
.sb .mi.active .tb { color: #000; }
.sb .sub a { display: block; padding: 0 14px 0 46px; font: 400 13px/34px var(--sp-font-control); color: var(--sp-text-menu); cursor: default; }
.sb .sub a.on { color: #000; }
.f-m .sb { width: 280px; transform: translateX(-100%); top: 48px; box-shadow: none; }
.f-m .sb.open { transform: none; }
.hdr { position: absolute; top: 0; left: 250px; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; background: var(--sp-bg-page); z-index: 15; }
.hdr .l { display: flex; align-items: center; height: 100%; }
.hdr .lnk { display: flex; align-items: center; gap: 8px; color: var(--sp-text); padding: 0 25px 0 30px; font-size: 14px; cursor: default; }
.hdr .lnk + .lnk { border-left: 1px solid var(--sp-border-divider); padding-left: 20px; }
.hdr .r { display: flex; align-items: center; gap: 10px; }
.hdr .un { font-size: 14px; color: var(--sp-text-heading); } .hdr .un b { font-weight: 400; } .hdr .un span { display: block; font-size: 11.6px; color: var(--sp-text); line-height: 1.2; }
.hdr .av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--sp-master-light); }
.f-m .hdr { left: 0; height: 48px; background: #fff; border-bottom: 1px solid var(--sp-border); padding: 0 15px; }
.f-m .hdr .burger { background: none; border: 0; padding: 6px; color: var(--sp-text); cursor: pointer; }
.f-m .hdr .mbrand { position: absolute; left: 50%; transform: translateX(-50%); font: 600 18px/1 var(--sp-font-label); color: var(--sp-text-heading); }
.screen { position: absolute; top: 60px; left: 250px; right: 0; bottom: 0; overflow: auto; }
.f-m .screen { top: 48px; left: 0; }
.content { padding: 0 30px 40px; }
.f-m .content { padding: 0 16px 60px; }
.mask { position: absolute; inset: 48px 0 0 0; background: var(--sp-backdrop); z-index: 18; }

/* Sayfa başlığı */
.crumb { display: flex; align-items: center; gap: 0; padding: 15px 0; margin: 0; list-style: none; }
.crumb li { font: 500 var(--sp-fs-micro)/24px var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text-ink); margin: 0 5px 0 0; display: flex; align-items: center; gap: 5px; }
.crumb li.p { color: var(--sp-text-crumb); }
.crumb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Kart */
.card { background: #fff; border: 1px solid var(--sp-border); border-radius: var(--sp-r-card); margin-bottom: 20px; }
.card-h { padding: 20px 20px 7px; min-height: 48px; }
.card-t { font: 500 var(--sp-fs-micro)/normal var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text); margin: 0; }
.card-b { padding: 20px; }
.f-m .card-b { padding: 15px; }
.dcard { background: #fff; border-radius: 4px 4px 2px 2px; margin-bottom: 10px; }
.dcard-h { padding: 15px 15px 12px; border-bottom: 1px solid var(--sp-border-divider); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dcard-h h5 { font: 700 14px/22.7px var(--sp-font-control); color: var(--sp-info); margin: 0; letter-spacing: -.006em; }
.dcard-b { padding: 15px; }
.metric { font: 300 24px/35.88px var(--sp-font-body); color: var(--sp-primary); margin: 0; }
.metric.neg { color: var(--sp-danger); } .metric.ink { color: var(--sp-text-heading); }
.mlabel { font: 300 16px/25.88px var(--sp-font-body); color: var(--sp-text-heading); opacity: .7; margin: 0; }
.subrow { display: flex; justify-content: space-between; gap: 8px; font-size: 11.6px; line-height: 18px; color: var(--sp-text); }

/* Buton */
.btn { font: 400 14px/21px var(--sp-font-control); padding: 6px 17px; border: 1px solid var(--sp-border-btn); border-radius: var(--sp-r-btn); background: #fff; color: var(--sp-text-btn-default);
  cursor: pointer; transition: color var(--sp-t-color), background-color var(--sp-t-color), border-color var(--sp-t-color); display: inline-flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: .01em; }
.f-d .btn:hover { background: var(--sp-bg-page); border-color: var(--sp-border-btn-hover); color: var(--sp-text-strong); }
.btn-complete { background: var(--sp-complete); border-color: var(--sp-complete); color: #fff; }
.f-d .btn-complete:hover { background: var(--sp-complete-light); border-color: var(--sp-complete-light); color: #fff; }
.btn-complete:active { background: var(--sp-complete-dark); border-color: var(--sp-complete-dark); }
.btn-info { background: var(--sp-info); border-color: var(--sp-info); color: #fff; }
.f-d .btn-info:hover { background: var(--sp-info-light); border-color: var(--sp-info-light); color: #fff; }
.btn-danger { background: var(--sp-danger); border-color: var(--sp-danger); color: #fff; }
.btn-link { background: transparent; border: 0; color: var(--sp-text-btn-default); padding: 4px 6px; }
.f-d .btn-link:hover { background: transparent; color: var(--sp-text-strong); }
.btn-xs { padding: 2px 9px; font-size: 10.5px; }
.btn-cons { min-width: 120px; margin-right: 5px; }
.btn[disabled] { opacity: .6; cursor: not-allowed; }
.btn .bold, .btn b { font-weight: 700; }
.btnrow { display: flex; justify-content: flex-end; gap: 0; flex-wrap: wrap; }

/* Form kutusu (form-group-default) */
.fld { position: relative; background: #fff; border: 1px solid var(--sp-border); border-radius: var(--sp-r-input); padding: 7px 12px 4px; height: 54px; margin-bottom: 10px; transition: background-color var(--sp-t-field); }
.fld > label { display: block; font: 500 var(--sp-fs-micro)/20px var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text); margin: 0; }
.fld input, .fld select, .fld textarea { border: 0; background: none; width: 100%; height: 25px; margin-top: -4px; padding: 0; font: 14px var(--sp-font-control); color: var(--sp-text-heading); outline: 0; }
.fld textarea { height: 60px; resize: none; margin-top: 0; }
.fld.ta { height: auto; min-height: 104px; }
.fld input::placeholder, .fld textarea::placeholder { color: inherit; opacity: .33; }
.fld input:focus::placeholder { opacity: .7; }
.fld:focus-within { background: var(--sp-focus-bg); border-color: var(--sp-border-focus); }
.fld.req::after { content: "*"; position: absolute; right: 12px; top: 6px; color: var(--sp-danger); font: 20px Arial; }
.fld.err { background: var(--sp-error-bg); }
.fld.dis { background: var(--sp-disabled-bg); }
.fld.dis > label, .fld.dis input { color: var(--sp-text-disabled); }
.fld select { appearance: none; -webkit-appearance: none; color: #444; font-family: var(--sp-font-body); cursor: pointer; }
.fld .caret { position: absolute; right: 12px; bottom: 13px; width: 0; height: 0; border-style: solid; border-width: 5px 4px 0 4px; border-color: #888 transparent transparent transparent; pointer-events: none; }
.errtxt { font-size: 12px; color: var(--sp-danger); display: block; margin: -6px 0 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 30px; }
.f-m .grid2 { grid-template-columns: 1fr; }

/* Checkbox */
.cb { display: inline-flex; align-items: center; position: relative; padding-left: 25px; min-height: 20px; font-size: 13px; line-height: 20px; color: var(--sp-text); cursor: pointer; user-select: none; }
.cb input { position: absolute; opacity: 0; width: 17px; height: 17px; left: 0; top: 1.5px; margin: 0; cursor: pointer; }
.cb .box { position: absolute; left: 0; top: 1.5px; width: 17px; height: 17px; border: 1px solid var(--sp-border-check); border-radius: 3px; background: #fff; transition: border .2s linear; }
.cb input:checked + .box { border: 8.5px solid var(--sp-primary); }
.cb input:checked + .box::after { content: ""; position: absolute; left: -5.5px; top: -5.5px; width: 11px; height: 11px; background: var(--chk) center / 11px 11px no-repeat; }
.cb input:focus-visible + .box { outline: 2px solid var(--sp-primary); outline-offset: 2px; }
.cb.dis { color: var(--sp-text-disabled); cursor: not-allowed; }
.cb.dis .box { background: var(--sp-disabled-bg); }
.cb.dis input { cursor: not-allowed; }

/* Switch (switchery small, data-color complete) */
.sw { position: relative; width: 33px; height: 20px; border-radius: 20px; border: 1px solid var(--sp-border-switch); background: #fff; cursor: pointer; padding: 0; transition: background-color .3s, border-color .3s; box-sizing: content-box; }
.sw::after { content: ""; position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--sp-shadow-knob); transition: left .3s; }
.sw[aria-checked="true"] { background: var(--sp-complete); border-color: var(--sp-complete); }
.sw[aria-checked="true"]::after { left: 13px; }
.swrow { display: inline-flex; align-items: center; gap: 8px; font: 700 11px/1 var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text); }

/* Tablo */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { font: 500 var(--sp-fs-micro)/15px var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text-th); padding: 14px 20px 14px 18px; border-bottom: 1px solid var(--sp-border-row); text-align: left; white-space: nowrap; }
.tbl td { background: #fff; font-size: 13.5px; line-height: 19.3px; padding: 12px 20px; border-bottom: 1px solid var(--sp-border-row); vertical-align: middle; color: var(--sp-text); }
.tbl td.fs12 { font-size: 12px; }
.tbl.c td { padding: 12px 20px; }
.f-m .tbl td, .f-m .tbl th { padding: 10px; }

/* Sekmeler */
.tabs-v { list-style: none; margin: 0; padding: 0; border-left: 1px solid rgba(0,0,0,.1); }
.tabs-v button { display: block; position: relative; width: 100%; text-align: left; background: none; border: 0; padding: 13px 20px; min-width: 70px; font: 500 var(--sp-fs-micro)/17.85px var(--sp-font-label); text-transform: uppercase; letter-spacing: var(--sp-ls-micro); color: var(--sp-text-tab); cursor: pointer; }
.tabs-v button::after { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 0; background: var(--sp-danger); transition: width var(--sp-t-color); }
.tabs-v button[aria-selected="true"]::after { width: 3px; }
.f-d .tabs-v button:hover::after { width: 3px; }
.f-d .tabs-v button:hover { color: var(--sp-text); }

/* Segment buton grubu (btn-group-xs) */
.bgroup { display: inline-flex; flex-wrap: nowrap; }
.bgroup button { font: 400 10.5px/21px var(--sp-font-control); padding: 2px 14px; border: 1px solid var(--sp-border-btn); background: #fff; color: var(--sp-text-btn-default); cursor: pointer; margin-left: -1px; white-space: nowrap; transition: background-color var(--sp-t-color); }
.bgroup button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; } .bgroup button:last-child { border-radius: 0 3px 3px 0; }
.bgroup button[aria-pressed="true"] { background: var(--sp-master-lighter); border-color: var(--sp-master-light); color: var(--sp-text-heading); position: relative; z-index: 1; }
.f-d .bgroup button:hover { background: var(--sp-bg-page); }

/* Input-group (takvim eki) */
.igroup { display: flex; align-items: stretch; }
.igroup .fld { flex: 1; margin-bottom: 0; border-radius: 2px 0 0 2px; }
.igroup .addon { width: 50px; background: var(--sp-master-lighter); color: rgba(122,137,148,.47); display: grid; place-items: center; border: 1px solid var(--sp-border); border-left: 0; border-radius: 0 2px 2px 0; }

/* Etiket, uyarı */
.lbl-s { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; font-size: 11px; font-weight: 600; line-height: 1; border-radius: var(--sp-r-label); background: var(--sp-master-light); color: var(--sp-text); white-space: nowrap; }
.lbl-up { background: var(--sp-complete-dark); color: #fff; } .lbl-down { background: var(--sp-danger); color: #fff; }
.alert { padding: 9px 19px 9px 15px; border-radius: 3px; font-size: 13px; line-height: 19.5px; }
.alert-info { background: var(--sp-complete-lighter); color: var(--sp-complete-darker); }
.alert-danger { background: var(--sp-danger-lighter); color: var(--sp-danger-darker); }
.alert-warning { background: var(--sp-warning-lighter); color: var(--sp-warning-darker); }

/* Katman: modal, toast, tooltip */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.layer > * { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: var(--sp-backdrop); }
.modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 500px; max-width: calc(100% - 32px); max-height: calc(100% - 40px); overflow: auto; background: #fff; border: 1px solid var(--sp-border-modal); border-radius: var(--sp-r-modal); }
.modal-h { padding: 25px 25px 0; position: relative; }
.modal-h h4 { font: 300 18px/25.88px var(--sp-font-body); color: var(--sp-text-heading); margin: 0 0 5px; padding-right: 30px; }
.modal-x { position: absolute; right: 0; top: 0; width: 46px; height: 56px; background: none; border: 0; cursor: pointer; color: #000; display: grid; place-items: center; }
.modal-b { padding: 10px 25px 25px; }
.modal-f { padding: 0 25px 25px; display: flex; justify-content: flex-end; gap: 0; }
.toast { position: absolute; top: 20px; right: 20px; width: 360px; max-width: calc(100% - 40px); }
.toast .alert { display: flex; gap: 10px; align-items: flex-start; }
.toast .alert p { margin: 6px 0 0; }
.tip { position: absolute; background: rgba(0,0,0,.9); color: #fff; font: 12px/1.5 var(--sp-font-body); padding: 4px 8px; border-radius: 4px; max-width: 200px; text-align: center; pointer-events: none; }
.tip::after { content: ""; position: absolute; left: var(--ax, 50%); top: 100%; margin-left: -5px; border: 5px solid transparent; border-top-color: rgba(0,0,0,.9); }
.dd { position: absolute; left: -1px; right: -1px; top: calc(100% + 1px); background: #fff; border: 1px solid var(--sp-border); border-radius: 0 0 2px 2px; box-shadow: var(--sp-shadow-select); z-index: 30; max-height: 240px; overflow: auto; }
.dd button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 12px; background: #fff; border: 0; text-align: left; font: 14px/20px var(--sp-font-body); color: #444; cursor: pointer; }
.dd button:hover, .dd button:focus-visible { background: var(--sp-master-lighter); outline: 0; }
.dd .empty { padding: 8px 12px; font-size: 13px; color: var(--sp-text); }
.thumb { width: 40px; height: 40px; border-radius: 2px; overflow: hidden; background: var(--sp-master-lighter); flex: none; }
.thumb img { width: 100%; height: 100%; display: block; }
.thumb.s { width: 28px; height: 28px; }

.pricerow { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 0 15px; }
.f-m .pricerow { grid-template-columns: minmax(0, 1fr) 110px; }
.calcbtn { display: flex; justify-content: flex-end; margin: -4px 0 10px; }
.calc { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 0 20px; align-items: start; }
.f-m .calc { grid-template-columns: minmax(0, 1fr) 120px; gap: 0 12px; }
.res { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-height: 54px; text-align: right; }
.rv { font: 300 18px/26px var(--sp-font-body); color: var(--sp-text-heading); font-variant-numeric: tabular-nums; }

</style>
</head>

function ic(name, size, cls) {
  const d = ICONS[name]; if (!d) return '';
  size = size || 14;
  if (d.feather) return `<svg class="ic ${cls || ''}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.feather}</svg>`;
  const v = d.vb.split(' ').map(Number); const w = size * v[2] / v[3];
  return `<svg class="ic ${cls || ''}" width="${w.toFixed(2)}" height="${size}" viewBox="${d.vb}" fill="currentColor" aria-hidden="true"><path transform="${d.t}" d="${d.d}"/></svg>`;
}
function icDataUri(name, color) {
  const d = ICONS[name]; const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${d.vb}"><path fill="${color}" transform="${d.t}" d="${d.d}"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

const NF = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = (n, cur) => NF.format(round2(n)) + ' ' + (cur || 'TL');
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fmtDT = d => `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function img(key, cls) { return `<span class="thumb ${cls || ''}"><img alt="" src="${IMGS[key]}"></span>`; }

}

/* Cihaz çerçevesi: 1280×800 masaüstü / 393×852 mobil, mevcut genişliğe sığdırılır */
const FRAME = { scale: 1 };
function mountFrame(device) {
  const wrap = document.getElementById('fwrap'), fr = document.getElementById('frame');
  fr.className = 'frame ' + (device === 'm' ? 'f-m' : 'f-d');
  const W = device === 'm' ? 393 : 1280, H = device === 'm' ? 852 : 800;
  const fit = () => {
    const avail = document.getElementById('stage').clientWidth;
    const s = Math.min(1, avail / W); FRAME.scale = s;
    fr.style.transform = `scale(${s})`; wrap.style.width = (W * s) + 'px'; wrap.style.height = (H * s) + 'px';
  };
  fit();
  if (!FRAME.ro) { FRAME.ro = new ResizeObserver(() => FRAME.fit && FRAME.fit()); FRAME.ro.observe(document.getElementById('stage')); }
  FRAME.fit = fit;
  document.getElementById('cap').textContent = device === 'm' ? 'Mobil web · 393 × 852' : 'Masaüstü web · 1280 × 800';
}
function toFrame(el) {
  const f = document.getElementById('frame').getBoundingClientRect(), r = el.getBoundingClientRect(), s = FRAME.scale;
  return { x: (r.left - f.left) / s, y: (r.top - f.top) / s, w: r.width / s, h: r.height / s };
}

/* Toast (pgn "simple", sağ üst) */
let toastTimer = null;
function toast(type, title, msg) {
  const L = document.getElementById('layer');
  L.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<div class="alert alert-${type}">${ic(type === 'danger' ? 'fa-exclamation' : 'fa-check', 14)}<div><strong>${title}</strong><p>${msg}</p></div></div>`;
  L.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 4000);
}
/* Tooltip (Bootstrap 4: siyah zemin, 12 px) */
function showTip(target, text) {
  hideTip(); const L = document.getElementById('layer'); const r = toFrame(target);
  const t = document.createElement('div'); t.className = 'tip'; t.id = 'tip'; t.setAttribute('role', 'tooltip'); t.textContent = text; L.appendChild(t);
  const tw = t.offsetWidth, th = t.offsetHeight;
  let x = r.x + r.w / 2 - tw / 2; x = Math.max(6, Math.min(x, document.getElementById('frame').offsetWidth - tw - 6));
  t.style.left = x + 'px'; t.style.top = (r.y - th - 7) + 'px';
  t.style.setProperty('--ax', (r.x + r.w / 2 - x) + 'px');
}
function hideTip() { const t = document.getElementById('tip'); if (t) t.remove(); }

const rate = () => S.level === 'ozel' ? SPECIAL : LEVELS[+S.level];
function parsePrice(s) {
  s = String(s || '').trim(); if (!s) return null;
  if (!/^[\d.,]+$/.test(s)) return NaN;
  let n = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : (/^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g, '') : s);
  n = Number(n); return isFinite(n) && n > 0 ? n : NaN;
}
const commission = p => round2((p * rate() / 100 + FIXED) * (1 + VAT));

  document.getElementById('sc').innerHTML = `
    <h1>Senaryo paneli</h1>
    <p class="note">Bu panel ürünün parçası değil; tüm veriler örnektir. Oranlar Ücretler sayfasındaki tablodan, 0,49 TL sabit ücret ve %20 KDV yerel kod kopyasından alındı; finans ekibince teyit edilecek. Özel oran (%2,49) örnektir.</p>
    <h2>Görünüm</h2>${seg('pv-dev', [['d', 'Masaüstü'], ['m', 'Mobil']], S.device)}
    <h2>Sayfa</h2>${seg('pv-page', [['list', 'Ürün listeleme'], ['update', 'Ürün güncelleme']], S.page)}
    <h2>Kullanıcı</h2>${seg('pv-role', [['owner', 'Ana hesap'], ['subfin', 'Alt kullanıcı · finansal izinli'], ['subnofin', 'Alt kullanıcı · finansal izinsiz']], S.role)}
    <h2>Satıcının etkin oranı (TL işlem)</h2>
    <select id="pv-level">${LEVELS.map((r, i) => `<option value="${i}">Seviye ${i} · %${NF.format(r)}</option>`).join('')}<option value="ozel">Özel oran · %${NF.format(SPECIAL)} (örnek)</option></select>
    <label class="chk"><input type="checkbox" id="pv-exempt"> 150 TL kuralından muaf satıcı</label>
    <h2>Hızlı giriş · modaldaki alanlara yazar</h2>
    <div class="row"><span class="lbl">Satış fiyatı</span><div class="chips" id="pv-price">${['', '149,99', '150', '250', '1.000'].map(v => `<button type="button" data-v="${v}">${v || 'boş'}</button>`).join('')}</div></div>
    <div class="row"><span class="lbl">Desi</span><div class="chips" id="pv-desi">${['1', '3', '10', '0', '2,5', 'abc'].map(v => `<button type="button" data-v="${v}">${v}</button>`).join('')}</div></div>
    <div id="pv-dyn"></div>`;
  bindSeg('pv-dev', v => { S.device = v; S.menuOpen = false; mountFrame(v); renderAll(); });
  bindSeg('pv-page', v => { S.page = v; S.form = { ...FORMS[v] }; S.modal = false; renderAll(); });
  bindSeg('pv-role', v => { S.role = v; if (!buttonVisible()) S.modal = false; renderAll(); });
  document.getElementById('pv-level').addEventListener('change', e => { S.level = e.target.value; refreshModal(); renderPanel(); });
  document.getElementById('pv-exempt').addEventListener('change', e => { S.exempt = e.target.checked; refreshModal(true); renderPanel(); });
  const quick = (id, key) => document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (!S.modal) { S.log = 'Önce "Komisyon hesapla" ile modalı açın.'; renderPanel(); return; }
    if (key === 'desi' && !S.m.cargo) { S.log = 'Desi alanı için önce "Anlaşmalı kargo kullanacağım" işaretlenmeli.'; renderPanel(); return; }
    S.m[key] = b.dataset.v; onModalChange(); refreshModal(true); renderPanel();
  });
  quick('pv-price', 'price'); quick('pv-desi', 'desi');
}
function renderPanel() {
  [['pv-dev', S.device], ['pv-page', S.page], ['pv-role', S.role]].forEach(([id, v]) => document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)));
  document.getElementById('pv-level').value = S.level; document.getElementById('pv-exempt').checked = S.exempt;
  const p = parsePrice(S.m.price), pOk = p !== null && !isNaN(p), en = cargoEnabled(p);
  const c = pOk ? commission(p) : null, dOk = desiValid(S.m.desi);
  const rules = [
    { t: 'Buton: ürün listeleme veya güncelleme sayfası', ok: true },
    { t: 'Buton: para birimi TL', ok: S.form.currency === 'TL', v: 'Seçili: ' + S.form.currency },
    { t: 'Buton: ana hesap veya finansal izinli alt kullanıcı', ok: S.role !== 'subnofin' },
    { t: 'Modal her açılışta boş, forma değer yazmaz', ok: true, v: 'Formdaki fiyat: ' + (S.form.price || 'boş') },
    { t: 'Komisyon = (fiyat × oran + 0,49 TL) × 1,20', ok: pOk ? true : null, v: pOk ? `(${NF.format(p)} × %${NF.format(rate())} + 0,49) × 1,20 = ${fmt(c)}` : 'Geçerli fiyat yok → "—"' },
    { t: `Anlaşmalı kargo seçilebilir: fiyat ≥ ${MIN_CARGO} TL veya muaf satıcı`, ok: en, v: S.exempt ? 'Muaf satıcı: her fiyatta aktif.' : (pOk ? `Fiyat ${fmt(p)}` : 'Fiyat yok') },
    { t: 'Kargo ücreti = desi × 106 TL (KDV dahil)', ok: S.m.cargo ? (dOk ? true : false) : null, v: S.m.cargo ? (dOk ? `${S.m.desi} × 106 = ${fmt(+S.m.desi * CARGO_UNIT)}` : 'Desi 1 veya daha büyük tam sayı olmalı') : 'Checkbox işaretsiz' },
  ];
  const res = !buttonVisible() ? 'Buton görünmez.' : !S.modal ? 'Buton görünür; modal kapalı.' :
    `Komisyon: ${c !== null ? fmt(c) : '—'}${S.m.cargo ? ` · Kargo: ${dOk ? fmt(+S.m.desi * CARGO_UNIT) : '—'}` : ''}`;
  document.getElementById('pv-dyn').innerHTML = `<h2>Kurallar</h2>${rulesHTML(rules)}<div class="result">${res}</div><h2>Son işlem</h2><div class="log">${esc(S.log || '—')}</div>`;
}

/* ---- Ürün ekranı ---- */
function renderApp() {
  const f = S.form, d = S.device;
  document.getElementById('app').innerHTML = shellHTML({ device: d, active: 'products', sub: S.page === 'list' ? 'listproduct' : 'listed', menuOpen: S.menuOpen, subUser: S.role !== 'owner' }) + `
  <div class="screen" id="screen"><div class="content">
    ${crumbHTML(['Ürünler', S.page === 'list' ? 'Ürün Listeleme' : 'Ürün Güncelleme'])}
    <div class="card"><div class="card-h"><p class="card-t" style="color:#333">Ürün detaylarını girin</p></div>
      <div class="card-b" style="padding-top:8px"><div class="grid2">
        <div>
          <div class="fld req"><label for="f-name">Ürün adı</label><input id="f-name" type="text" value="${esc(f.name)}"></div>
          <div class="fld ta"><label for="f-desc">Ürün açıklaması</label><textarea id="f-desc">${esc(f.desc)}</textarea></div>
        </div>
        <div>
          <div class="pricerow">
            <div class="pricecol">
              <div class="fld req"><label for="f-price">Satış fiyatı</label><input id="f-price" type="text" inputmode="decimal" value="${esc(f.price)}"></div>
              ${buttonVisible() ? '<div class="calcbtn"><button type="button" class="btn btn-xs" id="open-calc">Komisyon hesapla</button></div>' : ''}
            </div>
            <div class="fld req curcol"><label for="f-cur">Para birimi</label><select id="f-cur">${['TL', 'USD', 'EUR'].map(c => `<option ${c === f.currency ? 'selected' : ''}>${c}</option>`).join('')}</select><span class="caret"></span></div>
          </div>
          <div class="fld req"><label for="f-stock">Stok adedi</label><input id="f-stock" type="text" inputmode="numeric" value="${esc(f.stock)}"></div>
        </div>
      </div></div></div>
  </div></div>`;
  renderLayer();
}
function modalBody() {
  const p = parsePrice(S.m.price), pOk = p !== null && !isNaN(p), en = cargoEnabled(p), dOk = desiValid(S.m.desi), dBad = S.m.desi !== '' && !dOk;
  return `
    <div class="calc">
      <div class="fld"><label for="m-price">Satış fiyatı</label><input id="m-price" type="text" inputmode="decimal" placeholder="Fiyat giriniz" value="${esc(S.m.price)}" autocomplete="off"></div>
      <div class="res"><span class="small hint">Komisyon tutarı</span><span class="rv" id="rv-com" aria-live="polite">${pOk ? fmt(commission(p)) : '—'}</span></div>
    </div>
    <label class="cb ${en ? '' : 'dis'}" style="margin:6px 0 12px"><input type="checkbox" id="m-cargo" ${S.m.cargo ? 'checked' : ''} ${en ? '' : 'disabled'}><span class="box"></span>Anlaşmalı kargo kullanacağım</label>
    ${S.m.cargo ? `<div class="calc">
      <div><div class="fld ${dBad ? 'err' : ''}"><label for="m-desi">Desi</label><input id="m-desi" type="text" inputmode="numeric" placeholder="Desi giriniz" value="${esc(S.m.desi)}" autocomplete="off" ${dBad ? 'aria-invalid="true" aria-describedby="desi-err"' : ''}></div>
      ${dBad ? '<span class="errtxt" id="desi-err">Desi 1 veya daha büyük bir tam sayı olmalıdır.</span>' : ''}</div>
      <div class="res"><span class="small hint">Anlaşmalı kargo ücreti</span><span class="rv" id="rv-cargo" aria-live="polite">${dOk ? fmt(+S.m.desi * CARGO_UNIT) : '—'}</span></div>
    </div>` : ''}`;
}
function renderLayer() {
  const L = document.getElementById('layer'); L.querySelectorAll('.backdrop,.modal').forEach(x => x.remove());
  if (!S.modal) return;
  L.insertAdjacentHTML('beforeend', `<div class="backdrop" data-act="mclose"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="modal-h"><h4 id="mt">Komisyon hesapla</h4><button class="modal-x" type="button" aria-label="Kapat" data-act="mclose">${ic('pg-close', 14)}</button></div>
      <div class="modal-b" id="mbody">${modalBody()}</div>
      <div class="modal-f"><button type="button" class="btn btn-cons" style="margin-right:0" data-act="mclose"><span class="bold">KAPAT</span></button></div>
    </div>`);
}
function refreshModal(full) {
  if (!S.modal) return;
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  if (full) { document.getElementById('mbody').innerHTML = modalBody(); }
  else {
    const p = parsePrice(S.m.price), el = document.getElementById('rv-com'); if (el) el.textContent = (p !== null && !isNaN(p)) ? fmt(commission(p)) : '—';
  }
  if (id && document.getElementById(id) && document.getElementById(id) !== a) { const n = document.getElementById(id); n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); }
}
function onModalChange() {
  const p = parsePrice(S.m.price);
  if (S.m.cargo && !cargoEnabled(p)) { S.m.cargo = false; S.m.desi = ''; S.log = `Fiyat ${MIN_CARGO} TL'nin altına düştü: işaret kalktı, desi silindi.`; }
}
function renderAll() { renderApp(); renderPanel(); }

/* ---- Olaylar ---- */
const app = document.getElementById('app');
app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],#open-calc'); if (!t) return;
  if (t.dataset.act === 'menu') { S.menuOpen = !S.menuOpen; renderApp(); return; }
  if (t.id === 'open-calc') { S.modal = true; S.m = { price: '', cargo: false, desi: '' }; S.log = 'Modal açıldı (alanlar boş).'; renderLayer(); renderPanel(); document.getElementById('m-price').focus(); }
});
app.addEventListener('input', ev => {
  const k = { 'f-name': 'name', 'f-desc': 'desc', 'f-price': 'price', 'f-stock': 'stock' }[ev.target.id]; if (k) S.form[k] = ev.target.value;
  if (k === 'price') renderPanel();
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'f-cur') { S.form.currency = ev.target.value; S.log = `Para birimi ${ev.target.value}: buton ${buttonVisible() ? 'görünür' : 'gizlendi'}.`; renderApp(); renderPanel(); }
});
const layer = document.getElementById('layer');
layer.addEventListener('click', ev => { const t = ev.target.closest('[data-act]'); if (t && t.dataset.act === 'mclose') { S.modal = false; renderLayer(); S.log = 'Modal kapatıldı; ürün formu değişmedi.'; renderPanel(); const b = document.getElementById('open-calc'); if (b) b.focus(); } });
layer.addEventListener('input', ev => {
  if (ev.target.id === 'm-price') {
    const before = cargoEnabled(parsePrice(S.m.price)), wasChecked = S.m.cargo;
    S.m.price = ev.target.value; onModalChange();
    const after = cargoEnabled(parsePrice(S.m.price));
    refreshModal(before !== after || wasChecked !== S.m.cargo); renderPanel();
  }
  if (ev.target.id === 'm-desi') {
    const wasBad = S.m.desi !== '' && !desiValid(S.m.desi); S.m.desi = ev.target.value; const isBad = S.m.desi !== '' && !desiValid(S.m.desi);
    if (wasBad !== isBad) refreshModal(true); else { const el = document.getElementById('rv-cargo'); if (el) el.textContent = desiValid(S.m.desi) ? fmt(+S.m.desi * CARGO_UNIT) : '—'; }
    renderPanel();
  }
});
layer.addEventListener('change', ev => {
  if (ev.target.id === 'm-cargo') { S.m.cargo = ev.target.checked; refreshModal(true); if (S.m.cargo) document.getElementById('m-desi').focus(); renderPanel(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.modal) { S.modal = false; renderLayer(); renderPanel(); } });

mountFrame(S.device); renderPanelStatic(); renderAll();

</script>
</body>
</html>
